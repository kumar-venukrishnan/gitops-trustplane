server:
  standalone:
    enabled: true
  dataStorage:
    enabled: true
    size: 2Gi
  hostAliases:
    # PoC-only: bypasses the broken cluster DNS alias for Authentik from OpenBao.
    # Keep the OIDC hostname unchanged so TLS hostname and issuer validation still apply.
    - ip: "10.96.181.67"
      hostnames:
        - "authentik.myorg.local"
  resources:
    requests:
      cpu: 250m
      memory: 256Mi

ui:
  enabled: true
  serviceType: ClusterIP

injector:
  enabled: false

csi:
  enabled: false
