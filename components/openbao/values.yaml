server:
  standalone:
    enabled: true
    config: |
      ui = true

      listener "tcp" {
        tls_disable = 1
        address = "[::]:8200"
        cluster_address = "[::]:8201"
      }

      storage "pebbledb" {
        path = "/openbao/data/pebbledb"
      }

      # Enable file-based audit logging for the PoC.
      # Remove this block or set server.auditStorage.enabled=false to disable it.
      audit {
        type = "file"
        path = "file/"

        options {
          file_path = "/openbao/audit/audit.log"
        }
      }

  dataStorage:
    enabled: true
    size: 2Gi

  auditStorage:
    enabled: true
    size: 1Gi
    mountPath: "/openbao/audit"

  # Ensure the mounted audit PVC is writable by the OpenBao process.
  statefulSet:
    securityContext:
      pod:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

  hostAliases:
    # PoC-only: bypasses the broken cluster DNS alias for Authentik from OpenBao.
    # Keep the OIDC hostname unchanged so TLS hostname and issuer validation still apply.
    - ip: "10.96.163.3"
      hostnames:
        - "authentik.myorg.local"

  resources:
    requests:
      cpu: 250m
      memory: 256Mi

ui:
  enabled: true
  serviceType: ClusterIP

injector:
  enabled: false

csi:
  enabled: false
