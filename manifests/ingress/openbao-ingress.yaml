apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openbao-ingress
  namespace: trust-plane
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - openbao.myorg.local
      secretName: openbao-tls
  rules:
    - host: openbao.myorg.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openbao
                port:
                  number: 8200
