apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: authentik-ingress
  namespace: trust-plane
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - authentik.myorg.local
      secretName: authentik-tls
  rules:
    - host: authentik.myorg.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: authentik-server
                port:
                  number: 80
