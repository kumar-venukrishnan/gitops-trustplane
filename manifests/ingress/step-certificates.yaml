apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: step-certificates
  namespace: trust-plane
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - step-ca.myorg.local
      secretName: myorg-local-tls
  rules:
    - host: step-ca.myorg.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: step-ca-step-certificates
                port:
                  number: 443
