apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: step-ca
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  sources:
    - repoURL: https://smallstep.github.io/helm-charts
      chart: step-certificates
      targetRevision: 1.28.1
      helm:
        releaseName: step-ca
        valueFiles:
          - $values/components/step-ca/values.yaml
    - repoURL: https://github.com/kumar-venukrishnan/gitops-trustplane.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: trust-plane
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
