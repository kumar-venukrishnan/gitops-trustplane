apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trust-plane-pki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: https://github.com/kumar-venukrishnan/gitops-trustplane.git
    targetRevision: main
    path: manifests/pki
  destination:
    server: https://kubernetes.default.svc
    namespace: trust-plane
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
