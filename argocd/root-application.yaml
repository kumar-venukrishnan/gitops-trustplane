apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trust-plane-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kumar-venukrishnan/gitops-trustplane.git
    targetRevision: main
    path: argocd/applications
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      enabled: false
    syncOptions:
      - CreateNamespace=true
